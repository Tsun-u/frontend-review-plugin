<!DOCTYPE html>
<html lang="zh-TW">
<head><meta charset="utf-8"><title>Text Styling Test</title>
<style>
  a.no-underline { text-decoration: none; color: #333; }
  .strikethrough { text-decoration: line-through; }
  .bold-text { font-weight: 700; }
  .italic-text { font-style: italic; }
</style>
</head>
<body>
<nav>
  <a href="#" class="no-underline">關於我們</a>
  <a href="#">有底線的連結</a>
</nav>
<main>
  <p>原價 <span class="strikethrough">$1280</span> 特價 $980</p>
  <p class="bold-text">重要公告：系統維護中</p>
  <p class="italic-text">引用自某份報告</p>
  <p>普通內文不應出現在結果中</p>
</main>
</body>
</html>
